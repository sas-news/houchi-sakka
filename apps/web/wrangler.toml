name = "houchi-sakka-web"
main = "workers/app.ts"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]

# vite build のクライアント成果物 (react-router build → build/client)
[assets]
directory = "./build/client/"
binding = "ASSETS"

# ローカル開発: pnpm d1:migrate --local
# (migrations は packages/database/migrations が正本)
[[d1_databases]]
binding = "DB"
database_name = "houchi-sakka"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../../packages/database/migrations"

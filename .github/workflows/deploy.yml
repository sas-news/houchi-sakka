# main push / 手動実行 (workflow_dispatch) で apps/web を
# Cloudflare Workers にデプロイする。
#
# 必要なリポジトリ Secrets (GitHub → Settings → Secrets and variables → Actions):
#   CF_API_TOKEN   Cloudflare API トークン (Workers Scripts と D1 の編集権限)
#   CF_ACCOUNT_ID  Cloudflare アカウント ID
#
# 前提: apps/web/wrangler.production.toml の database_id を
# 本番 D1 のものに書き換えておく (初回のみ)。
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Apply D1 migrations
        working-directory: apps/web
        run: pnpm d1:migrate:prod

      - name: Deploy apps/web to Cloudflare Workers
        working-directory: apps/web
        run: pnpm exec wrangler deploy --config wrangler.production.toml
